# Site block for the RAG app. Merge into the existing certbot-managed server for the domain
# (keep its ssl_* lines); do not touch other sites on the VM. Nginx proxies only to Next.js:
# FastAPI (8000) and Qdrant (6333) are never exposed.
server {
    listen 443 ssl;
    server_name tarun.runs-on.dev;
    # ssl_certificate / ssl_certificate_key: as managed by certbot

    # REQUIRED: the app has no authentication and one shared workspace. Create the password file
    # before enabling this site; if it is missing Nginx answers 500 (fails closed).
    auth_basic "Enterprise RAG";
    auth_basic_user_file /etc/nginx/rag.htpasswd;   # htpasswd -c /etc/nginx/rag.htpasswd <user>
    # optionally also an IP allowlist: allow 203.0.113.0/24; deny all;

    client_max_body_size 200M;   # uploads; matches API_MAX_UPLOAD_MB

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;         # answers can take a while
        proxy_request_buffering off;     # stream uploads to Next.js, which streams them to the API
    }
}
