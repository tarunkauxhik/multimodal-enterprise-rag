[project]
name = "multimodal-enterprise-rag"
version = "0.1.0"
description = "Multimodal enterprise RAG and document intelligence (V1: Streamlit + Qdrant)"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added in the step that first uses them.
dependencies = [
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "pymupdf4llm>=1.28.2",
    "qdrant-client>=1.19.0",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests use in-memory Qdrant, where payload indexes are a no-op.
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]
