# Streamlit settings for app.py. Run `streamlit run app.py` from the repository root so this file is used.
# Every value can be overridden with an environment variable, e.g.
#   STREAMLIT_SERVER_ADDRESS=0.0.0.0   STREAMLIT_SERVER_PORT=8501   STREAMLIT_SERVER_MAX_UPLOAD_SIZE=500

[server]
# Localhost only: the app has no authentication. On a VPS, keep this and put a reverse proxy
# (TLS + access control) or an SSH tunnel in front instead of binding to 0.0.0.0.
address = "127.0.0.1"
port = 8501
# Maximum upload size per file, in MB (Streamlit's default).
maxUploadSize = 200

[browser]
gatherUsageStats = false
